name: bilisail
description: BiliSail, a cross-platform third-party Bilibili client focused on the viewing experience, built with Flutter.
publish_to: none
version: 0.1.1+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.6'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  drift: 2.35.1
  path: 1.9.1
  crypto: 3.0.7
  path_provider: 2.1.6
  flutter_secure_storage: 11.2.0
  qr_flutter: 4.1.0
  window_manager: 0.5.2
  url_launcher: 6.3.2
  package_info_plus: 10.2.2
  bili_api:
    path: packages/bili_api
  bili_player:
    path: packages/bili_player
  bili_danmaku:
    path: packages/bili_danmaku

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/branding/app_icon.png
    - assets/fonts/harmonyos_sans/LICENSE.txt
    - assets/fonts/alibaba_puhuiti/LICENSE.txt
  fonts:
    - family: Alibaba PuHuiTi 3.0
      fonts:
        - asset: assets/fonts/alibaba_puhuiti/AlibabaPuHuiTi-3-55-Regular.ttf
          weight: 400
        - asset: assets/fonts/alibaba_puhuiti/AlibabaPuHuiTi-3-65-Medium.ttf
          weight: 500
        - asset: assets/fonts/alibaba_puhuiti/AlibabaPuHuiTi-3-75-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/alibaba_puhuiti/AlibabaPuHuiTi-3-85-Bold.ttf
          weight: 700
    - family: HarmonyOS Sans
      fonts:
        - asset: assets/fonts/harmonyos_sans/HarmonyOS_Sans_SC_Regular.ttf
          weight: 400
        - asset: assets/fonts/harmonyos_sans/HarmonyOS_Sans_SC_Medium.ttf
          weight: 500
        - asset: assets/fonts/harmonyos_sans/HarmonyOS_Sans_SC_Bold.ttf
          weight: 700
    - family: BiliIcons
      fonts:
        - asset: assets/fonts/biliicon.ttf
