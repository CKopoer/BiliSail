name: Restore pinned Flutter and Pub
description: Restore shared dependencies without registering automatic cache writers.
inputs:
  architecture:
    description: Native SDK host architecture.
    default: '${{ runner.arch }}'
  cache-sdk:
    description: Retain SDK caches only where repeated reads justify their size.
    default: 'true'
outputs:
  sdk-key:
    value: ${{ steps.metadata.outputs.CACHE-KEY }}
  sdk-path:
    value: ${{ steps.metadata.outputs.CACHE-PATH }}
  sdk-hit:
    value: ${{ steps.sdk.outputs.cache-hit }}
  pub-key:
    value: ${{ steps.pub.outputs.cache-primary-key }}
  pub-path:
    value: ${{ steps.metadata.outputs.PUB-CACHE-PATH }}
  pub-hit:
    value: ${{ steps.pub.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Resolve cache paths without downloading Flutter
      id: metadata
      shell: pwsh
      env:
        SDK_ARCH: ${{ inputs.architecture }}
      run: |
        $revision = (Get-Content -LiteralPath .flutter-version -Raw).Trim()
        if ($revision -cnotmatch '^[a-f0-9]{40}$') { throw 'Expected a full Flutter main Git revision.' }
        $platform = $env:RUNNER_OS.ToLowerInvariant()
        $arch = $env:SDK_ARCH.ToLowerInvariant()
        $root = Join-Path $env:RUNNER_TOOL_CACHE "flutter-main/$revision/$arch"
        $pub = Join-Path $env:RUNNER_TOOL_CACHE 'bilisail-pub'
        "CACHE-KEY=flutter-$platform-main-$revision-$arch" >> $env:GITHUB_OUTPUT
        "CACHE-PATH=$root" >> $env:GITHUB_OUTPUT
        "PUB-CACHE-PATH=$pub" >> $env:GITHUB_OUTPUT
        "PUB-CACHE-KEY=bilisail-pub-v2-$platform-$env:RUNNER_ARCH-$revision" >> $env:GITHUB_OUTPUT
        "FLUTTER_ROOT=$root" >> $env:GITHUB_ENV
        "PUB_CACHE=$pub" >> $env:GITHUB_ENV
        @((Join-Path $root 'bin'), (Join-Path $root 'bin/cache/dart-sdk/bin'), (Join-Path $pub 'bin')) >> $env:GITHUB_PATH
    - name: Restore Flutter SDK
      id: sdk
      if: inputs.cache-sdk == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.metadata.outputs.CACHE-PATH }}
        key: ${{ steps.metadata.outputs.CACHE-KEY }}
    - name: Restore Pub dependencies
      id: pub
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.metadata.outputs.PUB-CACHE-PATH }}
        key: ${{ steps.metadata.outputs.PUB-CACHE-KEY }}-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ steps.metadata.outputs.PUB-CACHE-KEY }}-
    - name: Bootstrap pinned Flutter main
      shell: pwsh
      run: ./tool/setup-flutter-main.ps1 -Destination $env:FLUTTER_ROOT
