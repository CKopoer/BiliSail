name: macOS x64 startup reproduction

on:
  push:
    branches: [codex/macos-startup-crash]
    paths:
      - .github/workflows/macos-x64-reproduce.yml
      - tool/macos_crash_diagnostics.py
      - tool/macos-release-validation.ps1

permissions:
  contents: read
  actions: read

jobs:
  reproduce:
    runs-on: macos-26-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: BiliSail-macos-x64-1.2.5+3-packages
          run-id: 41183623821
          github-token: ${{ github.token }}
          path: downloaded
      - name: Open the exact signed application that passed CI
        shell: bash
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/bilisail-dmg"
          mkdir -p "$mount"
          hdiutil attach downloaded/*.dmg -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          ditto "$mount/BiliSail.app" "$RUNNER_TEMP/BiliSail.app"
      - name: Identify the runner Metal device
        shell: bash
        timeout-minutes: 2
        run: |
          swift -e 'import Metal; if let device = MTLCreateSystemDefaultDevice() { print("Metal device: \(device.name); recommended memory: \(device.recommendedMaxWorkingSetSize)") } else { print("Metal device unavailable") }'
      - name: Validate system crash collection using an intentional signal
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tool/macos-release-validation.ps1
          $directory = Join-Path (Get-Location) 'diagnostics/intentional-signal'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $code = @'
          import json, os, pathlib, signal, subprocess, sys, time
          path = pathlib.Path(sys.argv[1])
          expected = sys.argv[2]
          deadline = time.monotonic() + 120
          while time.monotonic() < deadline:
              try:
                  state = json.loads(path.read_text())
                  if state.get("lastStage") == "BILISAIL_RELEASE_STAGE:first-frame":
                      pid = state["processId"]
                      name = subprocess.check_output(["/bin/ps", "-p", str(pid), "-o", "comm="], text=True).strip()
                      if name != expected:
                          raise SystemExit("Owned test process identity did not match")
                      os.kill(pid, signal.SIGSEGV)
                      raise SystemExit(0)
              except (OSError, ValueError):
                  pass
              time.sleep(0.02)
          raise SystemExit("Controlled signal target did not reach first frame")
          '@
          $start = [System.Diagnostics.ProcessStartInfo]::new()
          $start.FileName = 'python3'
          $start.UseShellExecute = $false
          $executable = "$env:RUNNER_TEMP/BiliSail.app/Contents/MacOS/BiliSail"
          foreach ($argument in @('-c', $code, "$directory/startup.result.json", $executable)) { $start.ArgumentList.Add($argument) }
          $injector = [System.Diagnostics.Process]::Start($start)
          try {
            try { Invoke-MacOSReleaseSmokePhase $executable 'startup' ([guid]::NewGuid().ToString('N')) $directory } catch {}
            if (!$injector.WaitForExit(5000) -or $injector.ExitCode -ne 0) { throw 'Intentional signal was not delivered.' }
            $state = Get-Content "$directory/startup.result.json" -Raw | ConvertFrom-Json
            $crash = Get-Content "$directory/startup.crash.json" -Raw | ConvertFrom-Json
            if ($state.exitCode -ne 139 -or $crash.status -ne 'collected' -or $crash.exception.signal -ne 'SIGSEGV') { throw 'System crash collection failed its controlled-signal validation.' }
            Write-Host 'Intentional SIGSEGV report was matched, sanitized and collected.'
          } finally {
            if (!$injector.HasExited) { $injector.Kill($true); [void]$injector.WaitForExit(5000) }
            $injector.Dispose()
          }
      - name: Collect independent startup attempts and preserve every failure
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tool/macos-release-validation.ps1
          Confirm-MacOSReleaseSignature "$env:RUNNER_TEMP/BiliSail.app" $env:RUNNER_TEMP
          $failed = $false
          for ($iteration = 1; $iteration -le 2; $iteration++) {
            Write-Host "Startup repetition $iteration of 2"
            $directory = "diagnostics/attempt-$iteration"
            New-Item -ItemType Directory -Path $directory -Force | Out-Null
            try {
              Invoke-MacOSReleaseSmokePhase "$env:RUNNER_TEMP/BiliSail.app/Contents/MacOS/BiliSail" 'startup' ([guid]::NewGuid().ToString('N')) $directory
            } catch {
              $failed = $true
              $state = Get-Content "$directory/startup.result.json" -Raw | ConvertFrom-Json
              # A Dart assertion is retained as a failed attempt. Continue only
              # this research run to capture the distinct native crash/hang.
              if ($state.exitCode -ne 1 -or $state.timedOut) { throw }
              Write-Warning "Dart startup failure retained in attempt $iteration."
            }
          }
          if ($failed) { throw 'One or more independent startup attempts failed.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        timeout-minutes: 2
        with:
          name: macos-x64-reproduction-diagnostics
          path: |
            diagnostics/**/*.result.json
            diagnostics/**/*.crash.json
            diagnostics/**/*.sample.json
          if-no-files-found: warn
          retention-days: 7

  rebuild:
    name: Fresh Intel build ${{ matrix.repetition }}
    runs-on: macos-15-intel
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2]
    env:
      PUB_HOSTED_URL: https://pub.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
          pub-cache-key: 'flutter-pub-:os:-:arch:-:version:'
      - name: Build the unchanged application and run every release gate
        shell: pwsh
        timeout-minutes: 30
        run: ./tool/build-release.ps1 -Target macos-x64 -Version '1.2.5+3'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        timeout-minutes: 2
        with:
          name: fresh-intel-${{ matrix.repetition }}-diagnostics
          path: |
            artifacts/macos-x64/validation/*.result.json
            artifacts/macos-x64/validation/*.crash.json
            artifacts/macos-x64/validation/*.sample.json
          if-no-files-found: warn
          retention-days: 7
