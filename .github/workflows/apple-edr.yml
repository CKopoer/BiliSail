name: BiliSail Darwin EDR
on:
  push:
    branches: [codex/apple-edr-joc]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: darwin-edr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  slice:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [mac-arm, mac-intel, iphone, sim-arm, sim-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: CKopoer/libmpv-darwin-build
          ref: 6943394d8a7df826a8e57d212f93359d063b6004
      - uses: actions/checkout@v4
        with:
          repository: mpv-player/mpv
          ref: 41f6a645068483470267271e1d09966ca3b9f413
          path: mpv
      - uses: actions/checkout@v4
        with:
          repository: mpvkit/MPVKit
          ref: d9194243bdc68b87d8989376ab52aee7da6c8e0b
          path: kit
      - uses: actions/cache@v4
        with:
          path: archives
          key: darwin-edr-inputs-${{ hashFiles('bilisail/dependencies.json') }}
      - name: Build libmpv and validate Apple slice
        run: |
          brew list meson >/dev/null || brew install meson
          brew list ninja >/dev/null || brew install ninja
          git -C mpv apply ../kit/Sources/BuildScripts/patch/libmpv/0001-player-add-moltenvk-context.patch
          git -C mpv apply ../bilisail/joc-packet-probe.patch ../bilisail/embedded-cocoa.patch
          python3 bilisail/build.py build ${{ matrix.target }}
      - name: Exercise compressed JOC renderer
        if: matrix.target == 'mac-arm'
        run: |
          curl --fail --silent --show-error -L --range 0-33554431 --max-time 180 'https://media.developer.dolby.com/DolbyVision_Atmos/mp4/iOS_P5_GlassBlowing2_1920x1080%4059.94fps_15200kbps.mp4' -o sample-prefix.mp4
          echo '2e1a62c39519ccef267353672aff6c2985b7ef145739fb60b56029fa91ec6fac  sample-prefix.mp4' | shasum -a 256 -c -
          ./joc-probe sample-prefix.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: slice-${{ matrix.target }}
          path: slices/${{ matrix.target }}/Mpv
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: configure-${{ matrix.target }}
          path: mpv-build/meson-logs/meson-log.txt
          if-no-files-found: ignore
  archive:
    needs: slice
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: CKopoer/libmpv-darwin-build
          ref: 6943394d8a7df826a8e57d212f93359d063b6004
      - uses: actions/checkout@v4
        with:
          repository: mpv-player/mpv
          ref: 41f6a645068483470267271e1d09966ca3b9f413
          path: mpv
      - uses: actions/download-artifact@v4
        with:
          pattern: slice-*
          path: downloads
      - name: Package universal XCFrameworks
        run: |
          mkdir slices
          for f in downloads/slice-*; do mv "$f" "slices/${f#downloads/slice-}"; done
          python3 bilisail/build.py package macos
          python3 bilisail/build.py package ios
          shasum -a 256 bilisail-edr-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-edr
          path: bilisail-edr-*.tar.gz
