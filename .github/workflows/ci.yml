name: Apple renderer SDK validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    name: Compile ${{ matrix.platform }} native output
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/restore-flutter
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: CKopoer/media-kit
          ref: 302d60eedc55ca677e911e529569b1e14d8c2e7e
          path: native-source
      - name: Compile real Swift plugin with Apple SDK and Flutter framework
        run: bash tool/validate-apple-lifecycle.sh ${{ matrix.platform }}
