name: CI

on:
  push:
    branches: ['**', '!dependabot/**']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: '版本 x.y.z+N（留空使用 pubspec.yaml）'
        type: string
        default: ''
      enable_android:
        type: boolean
        default: true
      enable_windows:
        description: Windows x64 MSIX / MSI / EXE 安装包
        type: boolean
        default: true
      enable_macos:
        description: macOS arm64 / Intel x64 DMG 安装文件
        type: boolean
        default: true
      enable_ios:
        description: iOS arm64 unsigned IPA
        type: boolean
        default: true
      enable_linux:
        description: Linux x64 Flatpak / AppImage
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        description: Flutter version (build name plus build number); empty uses pubspec.yaml.
        type: string
        default: ''
      enable_android:
        type: boolean
        default: true
      enable_windows:
        description: Windows x64 MSIX / MSI / EXE installers.
        type: boolean
        default: true
      enable_macos:
        description: macOS arm64 / Intel x64 DMG installers.
        type: boolean
        default: true
      enable_ios:
        description: iOS arm64 unsigned IPA (requires signing before installation).
        type: boolean
        default: true
      enable_linux:
        description: Linux x64 Flatpak / AppImage.
        type: boolean
        default: true
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      MSIX_CERTIFICATE_BASE64:
        required: false
      MSIX_CERTIFICATE_PASSWORD:
        required: false
    outputs:
      version:
        description: Version used by every selected build.
        value: ${{ jobs.prepare.outputs.version }}

permissions:
  contents: read

env:
  # Match the official hosted source recorded in all five lockfiles.
  PUB_HOSTED_URL: https://pub.dev

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve version and platforms
        id: plan
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          # Push/PR has no inputs; a reusable caller can explicitly pass false.
          ENABLE_ANDROID: ${{ !contains(toJSON(inputs), '"enable_android"') || inputs.enable_android }}
          ENABLE_WINDOWS: ${{ !contains(toJSON(inputs), '"enable_windows"') || inputs.enable_windows }}
          ENABLE_MACOS: ${{ !contains(toJSON(inputs), '"enable_macos"') || inputs.enable_macos }}
          ENABLE_IOS: ${{ !contains(toJSON(inputs), '"enable_ios"') || inputs.enable_ios }}
          ENABLE_LINUX: ${{ !contains(toJSON(inputs), '"enable_linux"') || inputs.enable_linux }}
        run: |
          $version = $env:REQUESTED_VERSION.Trim()
          if (!$version) {
            $match = [regex]::Match((Get-Content pubspec.yaml -Raw), '(?m)^version:\s*(\S+)\s*$')
            if (!$match.Success) { throw 'pubspec.yaml has no version.' }
            $version = $match.Groups[1].Value
          }
          if ($version -cnotmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)\+(0|[1-9]\d*)$') {
            throw 'Version must be x.y.z+N, for example 0.1.0+1.'
          }
          if ($env:ENABLE_ANDROID -eq 'true') {
            . ./tool/android-version.ps1
            Get-AndroidVersionCode $version | Out-Null
          }
          $platforms = @(
            if ($env:ENABLE_ANDROID -eq 'true') { @{ target = 'android-arm64'; runner = 'ubuntu-24.04'; arch = 'x64' } }
            if ($env:ENABLE_WINDOWS -eq 'true') { @{ target = 'windows-x64'; runner = 'windows-2022'; arch = 'x64' } }
            if ($env:ENABLE_MACOS -eq 'true') {
              @{ target = 'macos-arm64'; runner = 'macos-15'; arch = 'arm64' }
              @{ target = 'macos-x64'; runner = 'macos-15-intel'; arch = 'x64' }
            }
            if ($env:ENABLE_IOS -eq 'true') { @{ target = 'ios-arm64'; runner = 'macos-15'; arch = 'arm64' } }
            if ($env:ENABLE_LINUX -eq 'true') { @{ target = 'linux-x64'; runner = 'ubuntu-24.04'; arch = 'x64' } }
          )
          if (!$platforms.Count) { throw 'Select at least one platform.' }
          if ($env:ENABLE_WINDOWS -eq 'true' -and @(($version -split '[.+]') | Where-Object { [long]$_ -gt 65535 }).Count) {
            throw 'MSIX version components must be at most 65535.'
          }
          if ($env:ENABLE_WINDOWS -eq 'true') {
            . ./tool/windows-installers.ps1
            Get-WindowsMsiVersion $version | Out-Null
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "matrix=$(@{ include = @($platforms) } | ConvertTo-Json -Depth 3 -Compress)" >> $env:GITHUB_OUTPUT

  lint:
    name: Format and analyze
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
          # flutter-action appends the hash of all pubspec.lock files.
          pub-cache-key: 'flutter-pub-:os:-:arch:-:version:'
      - name: Check formatting, analysis and packaging boundaries
        shell: pwsh
        run: ./tool/check.ps1 -Stage Lint -EnforceLockfile
      - name: Show pinned SDK formatting differences
        if: failure()
        shell: bash
        run: |
          dart format lib test integration_test packages/*/lib packages/*/test
          git diff -- '*.dart'

      - name: Check Apple frameworks, Linux packaging, apt mirrors and download caches
        shell: bash
        run: |
          python3 -m unittest discover -s tool -p 'test_linux_*.py'
          python3 -m unittest discover -s tool -p 'test_apple_*.py'
          ruby -c ios/Podfile
          ruby -c macos/Podfile
          bash tool/test-linux-downloads.sh
          bash packages/bili_mux/tool/test-apple-framework.sh
          for script in tool/package-linux.sh tool/setup-linux-build.sh tool/linux-downloads.sh tool/linux-runtime-validation.sh; do
            bash -n "$script"
          done

  root-tests:
    name: Root app tests (shard ${{ matrix.shard }})
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
          pub-cache-key: 'flutter-pub-:os:-:arch:-:version:'
      - name: Run root app test shard
        shell: pwsh
        run: ./tool/check.ps1 -Stage RootTests -TotalShards 2 -ShardIndex ${{ matrix.shard }} -EnforceLockfile

  package-tests:
    name: Package tests
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
          pub-cache-key: 'flutter-pub-:os:-:arch:-:version:'
      - name: Run package tests covered outside the native mux job
        shell: pwsh
        run: ./tool/check.ps1 -Stage PackageTests -SkipMuxTests -EnforceLockfile

  # Preserve the existing required status and build dependency after splitting checks.
  check:
    name: Analyze and test
    if: ${{ always() }}
    needs: [lint, root-tests, package-tests, native-mux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check job to pass
        shell: bash
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          ROOT_TEST_RESULT: ${{ needs.root-tests.result }}
          PACKAGE_TEST_RESULT: ${{ needs.package-tests.result }}
          MUX_TEST_RESULT: ${{ needs.native-mux.result }}
        run: |
          if [[ "$LINT_RESULT" != success || "$ROOT_TEST_RESULT" != success || "$PACKAGE_TEST_RESULT" != success || "$MUX_TEST_RESULT" != success ]]; then
            echo "::error::Checks did not all pass: lint=$LINT_RESULT root=$ROOT_TEST_RESULT packages=$PACKAGE_TEST_RESULT mux=$MUX_TEST_RESULT"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: [prepare, check, native-mux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java for Android
        if: matrix.target == 'android-arm64'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          # Flutter plugins and the SDK also affect Android native dependencies.
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
            **/pubspec.lock
            .flutter-version
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          architecture: ${{ matrix.arch }}
          cache: true
          pub-cache-key: 'flutter-pub-:os:-:arch:-:version:'
      - name: Set up the Windows mux compiler
        id: windows-mux
        if: matrix.target == 'windows-x64'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-libarchive
      - name: Set up LZMA support for Windows Native Assets
        if: matrix.target == 'windows-x64'
        shell: pwsh
        env:
          BILI_MUX_MSYS_ROOT: ${{ steps.windows-mux.outputs.msys2-location }}
        run: ./tool/setup-windows-native-tar.ps1 -MsysRoot $env:BILI_MUX_MSYS_ROOT
      - name: Set up the Android mux compiler
        if: matrix.target == 'android-arm64'
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Resolve Linux dependency cache epoch
        id: linux-cache-epoch
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore Linux apt packages and verified packaging tools
        id: linux-downloads
        if: matrix.target == 'linux-x64'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bilisail/linux/apt/*.deb
            ~/.cache/bilisail/linux/tools
          key: linux-downloads-v1-ubuntu24.04-x64-${{ hashFiles('tool/setup-linux-build.sh', 'tool/linux-downloads.sh', 'tool/linux-apt-mirrors.py') }}-${{ steps.linux-cache-epoch.outputs.week }}
          restore-keys: |
            linux-downloads-v1-ubuntu24.04-x64-${{ hashFiles('tool/setup-linux-build.sh', 'tool/linux-downloads.sh', 'tool/linux-apt-mirrors.py') }}-
      - name: Restore Linux Flatpak Runtime and SDK
        id: linux-flatpak
        if: matrix.target == 'linux-x64'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/flatpak
          key: linux-flatpak-v1-ubuntu24.04-x64-${{ hashFiles('linux/packaging/dev.bilisail.bilisail.json', 'tool/setup-linux-build.sh') }}-${{ steps.linux-cache-epoch.outputs.week }}
          restore-keys: |
            linux-flatpak-v1-ubuntu24.04-x64-${{ hashFiles('linux/packaging/dev.bilisail.bilisail.json', 'tool/setup-linux-build.sh') }}-
      - name: Set up Linux build and packaging dependencies
        if: matrix.target == 'linux-x64'
        shell: bash
        run: bash tool/setup-linux-build.sh
      # Save dependencies before building the app, so a packaging failure does
      # not discard downloads. The Flatpak snapshot contains no built app.
      - name: Save Linux apt packages and verified packaging tools
        if: matrix.target == 'linux-x64' && steps.linux-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bilisail/linux/apt/*.deb
            ~/.cache/bilisail/linux/tools
          key: ${{ steps.linux-downloads.outputs.cache-primary-key }}
      - name: Save Linux Flatpak Runtime and SDK
        if: matrix.target == 'linux-x64' && steps.linux-flatpak.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/flatpak
          key: ${{ steps.linux-flatpak.outputs.cache-primary-key }}
      - name: Check Apple toolchain
        if: matrix.target == 'ios-arm64'
        shell: bash
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          pod --version
      - name: Build and package preview
        shell: pwsh
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          BILI_MUX_MSYS_ROOT: ${{ steps.windows-mux.outputs.msys2-location }}
          ANDROID_PREVIEW_SIGNING: ${{ matrix.target == 'android-arm64' && github.event_name == 'pull_request' }}
          ANDROID_KEYSTORE_BASE64: ${{ matrix.target == 'android-arm64' && github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ matrix.target == 'android-arm64' && github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ matrix.target == 'android-arm64' && github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ matrix.target == 'android-arm64' && github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
          ANDROID_SIGNING_CERTIFICATE_SHA256: ${{ matrix.target == 'android-arm64' && vars.ANDROID_SIGNING_CERTIFICATE_SHA256 || '' }}
          MSIX_CERTIFICATE_BASE64: ${{ matrix.target == 'windows-x64' && github.event_name != 'pull_request' && secrets.MSIX_CERTIFICATE_BASE64 || '' }}
          MSIX_CERTIFICATE_PASSWORD: ${{ matrix.target == 'windows-x64' && github.event_name != 'pull_request' && secrets.MSIX_CERTIFICATE_PASSWORD || '' }}
        run: ./tool/build-release.ps1 -Target $env:BUILD_TARGET -Version $env:BUILD_VERSION -AndroidPreviewSigning:($env:ANDROID_PREVIEW_SIGNING -eq 'true')
      - name: Collect Windows native build diagnostics
        if: failure() && matrix.target == 'windows-x64'
        shell: pwsh
        env:
          MSIX_CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: ./tool/collect-build-diagnostics.ps1
      - name: Upload Windows build diagnostics
        if: failure() && matrix.target == 'windows-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BiliSail-windows-x64-build-diagnostics
          path: artifacts/windows-x64/diagnostics/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload packages and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BiliSail-${{ matrix.target }}-packages
          path: artifacts/${{ matrix.target }}/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  native-mux:
    name: MP4 and MKV native regression
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
          pub-cache-key: 'flutter-pub-:os:-:arch:-:version:'
      - name: Build and verify the isolated MP4 component
        shell: bash
        run: |
          bash packages/bili_mux/tool/build.sh linux-x64
          bash packages/bili_mux/tool/build-test-ffprobe.sh
          export BILI_MUX_LIBRARY="$PWD/packages/bili_mux/native/prebuilt/linux-x64/libbili_mux.so"
          export BILI_MUX_FFPROBE="$PWD/build/download_mux/test-ffprobe-linux-x64/ffprobe"
          cd packages/bili_mux
          flutter pub get --enforce-lockfile
          flutter test --no-pub
