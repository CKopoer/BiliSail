name: SQLite download diagnosis
on:
  push:
    branches: [codex/ci-download-probe-20261108]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
          pub-cache-key: 'flutter-pub-:os:-:arch:-:version:'
      - name: Check HTTP recovery and credential handling
        run: python3 -m unittest discover -s tool -p test_sqlite_assets.py
      - name: Resolve the unchanged baseline lockfile
        run: flutter pub get --enforce-lockfile
      - name: Prepare and recheck a cold SQLite binary using the CI job token
        env:
          BILISAIL_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tool/prepare-sqlite-assets.py
          python3 tool/prepare-sqlite-assets.py
      - name: Verify SQLite native hook and database behavior
        run: flutter test --no-pub test/core/storage/app_database_test.dart
