name: CI

on:
  push:
    branches: ['**', '!dependabot/**']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: '版本 x.y.z+N（留空使用 pubspec.yaml）'
        type: string
        default: ''
      enable_android:
        type: boolean
        default: true
      enable_windows:
        description: Windows x64 / ARM64 MSIX / MSI / EXE 安装包
        type: boolean
        default: true
      enable_macos:
        description: macOS arm64 / Intel x64 DMG 安装文件
        type: boolean
        default: true
      enable_ios:
        description: iOS arm64 unsigned IPA
        type: boolean
        default: true
      enable_linux:
        description: Linux x64 Flatpak / AppImage
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        description: Flutter version (build name plus build number); empty uses pubspec.yaml.
        type: string
        default: ''
      build_targets:
        description: 'Optional JSON array limiting builds to a subset of the enabled platform targets.'
        type: string
        default: ''
      enable_android:
        type: boolean
        default: true
      enable_windows:
        description: Windows x64 / ARM64 MSIX / MSI / EXE installers.
        type: boolean
        default: true
      enable_macos:
        description: macOS arm64 / Intel x64 DMG installers.
        type: boolean
        default: true
      enable_ios:
        description: iOS arm64 unsigned IPA (requires signing before installation).
        type: boolean
        default: true
      enable_linux:
        description: Linux x64 Flatpak / AppImage.
        type: boolean
        default: true
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      MSIX_CERTIFICATE_BASE64:
        required: false
      MSIX_CERTIFICATE_PASSWORD:
        required: false
    outputs:
      version:
        description: Version used by every selected build.
        value: ${{ jobs.prepare.outputs.version }}

permissions:
  contents: read

# Automatic runs supersede older runs of the same branch/PR. A reusable
# release keeps its caller workflow and a unique dispatch group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'automatic' }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  # Match the official hosted source recorded in all five lockfiles.
  PUB_HOSTED_URL: https://pub.dev

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
      run-ci: ${{ steps.trigger.outputs.run-ci }}
      cache-write: ${{ steps.trigger.outputs.cache-write }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Avoid duplicate push and PR builds
        id: trigger
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { shouldRunCi } = require('./tool/ci-trigger.cjs');
            const { canWriteCaches } = require('./tool/ci-cache-policy.cjs');
            const run = await shouldRunCi({ github, context, core });
            core.setOutput('run-ci', run);
            core.setOutput('cache-write', canWriteCaches(context));
            if (!run) core.info('An open PR already runs CI for this branch; skipping the duplicate push build.');
      - name: Prune obsolete default-branch caches
        if: steps.trigger.outputs.cache-write == 'true'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { cleanupCaches } = require('./tool/ci-cache-policy.cjs');
            await cleanupCaches({ github, context, core });
      - name: Resolve version and platforms
        id: plan
        if: steps.trigger.outputs.run-ci == 'true'
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          BUILD_TARGETS: ${{ inputs.build_targets }}
          # Push/PR has no inputs; a reusable caller can explicitly pass false.
          ENABLE_ANDROID: ${{ !contains(toJSON(inputs), '"enable_android"') || inputs.enable_android }}
          ENABLE_WINDOWS: ${{ !contains(toJSON(inputs), '"enable_windows"') || inputs.enable_windows }}
          ENABLE_MACOS: ${{ !contains(toJSON(inputs), '"enable_macos"') || inputs.enable_macos }}
          ENABLE_IOS: ${{ !contains(toJSON(inputs), '"enable_ios"') || inputs.enable_ios }}
          ENABLE_LINUX: ${{ !contains(toJSON(inputs), '"enable_linux"') || inputs.enable_linux }}
        run: ./tool/ci-build-plan.ps1

  lint:
    name: Format and analyze
    needs: prepare
    if: needs.prepare.outputs.run-ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-flutter
        id: flutter
      - name: Save shared Linux SDK
        if: needs.prepare.outputs.cache-write == 'true' && steps.flutter.outputs.sdk-hit != 'true'
        uses: ./.github/actions/save-ci-cache
        with:
          key: ${{ steps.flutter.outputs.sdk-key }}
          path: ${{ steps.flutter.outputs.sdk-path }}
          reserve-bytes: '2200000000'
      - name: Check formatting, analysis and packaging boundaries
        shell: pwsh
        run: ./tool/check.ps1 -Stage Lint -EnforceLockfile
      # Lint resolves the root and all four packages, including dev dependencies.
      # The mux-only job must never publish an incomplete snapshot under this key.
      - name: Save complete Linux Pub dependencies
        if: needs.prepare.outputs.cache-write == 'true' && steps.flutter.outputs.pub-hit != 'true'
        uses: ./.github/actions/save-ci-cache
        with:
          key: ${{ steps.flutter.outputs.pub-key }}
          path: ${{ steps.flutter.outputs.pub-path }}
      - name: Show pinned SDK formatting differences
        if: failure() && steps.flutter.outcome == 'success'
        shell: bash
        run: |
          dart format lib test integration_test packages/*/lib packages/*/test
          git diff -- '*.dart'

      - name: Check Apple frameworks, Linux packaging, apt mirrors and download caches
        shell: bash
        run: |
          python3 -m unittest discover -s tool -p 'test_linux_*.py'
          python3 -m unittest discover -s tool -p 'test_apple_*.py'
          ruby -c ios/Podfile
          ruby -c macos/Podfile
          ruby -c tool/media-kit-apple-pods.rb
          bash tool/test-linux-downloads.sh
          bash packages/bili_mux/tool/test-apple-framework.sh
          for script in tool/package-linux.sh tool/setup-linux-build.sh tool/linux-downloads.sh tool/linux-appimage.sh tool/linux-runtime-validation.sh; do
            bash -n "$script"
          done

  root-tests:
    name: Root app tests (shard ${{ matrix.shard }})
    needs: prepare
    if: needs.prepare.outputs.run-ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-flutter
      - name: Run root app test shard
        shell: pwsh
        env:
          BILISAIL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tool/check.ps1 -Stage RootTests -TotalShards 4 -ShardIndex ${{ matrix.shard }} -EnforceLockfile

  package-tests:
    name: Package tests
    needs: prepare
    if: needs.prepare.outputs.run-ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-flutter
      - name: Run package tests covered outside the native mux job
        shell: pwsh
        run: ./tool/check.ps1 -Stage PackageTests -SkipMuxTests -EnforceLockfile

  # Preserve the required quality status while root tests overlap platform builds.
  check:
    name: Analyze and test
    if: ${{ always() && needs.prepare.outputs.run-ci != 'false' }}
    needs: [prepare, lint, root-tests, package-tests, native-mux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check job to pass
        shell: bash
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          ROOT_TEST_RESULT: ${{ needs.root-tests.result }}
          PACKAGE_TEST_RESULT: ${{ needs.package-tests.result }}
          MUX_TEST_RESULT: ${{ needs.native-mux.result }}
        run: |
          if [[ "$PREPARE_RESULT" != success || "$LINT_RESULT" != success || "$ROOT_TEST_RESULT" != success || "$PACKAGE_TEST_RESULT" != success || "$MUX_TEST_RESULT" != success ]]; then
            echo "::error::Checks did not all pass: lint=$LINT_RESULT root=$ROOT_TEST_RESULT packages=$PACKAGE_TEST_RESULT mux=$MUX_TEST_RESULT"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: [prepare, lint, package-tests, native-mux]
    if: needs.prepare.outputs.run-ci == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: write
    timeout-minutes: ${{ startsWith(matrix.target, 'macos-') && 40 || 90 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java for Android
        if: matrix.target == 'android-arm64'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Gradle dependencies
        id: gradle
        if: matrix.target == 'android-arm64'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches
          # Native plugins and the Flutter SDK also affect Gradle dependencies.
          key: bilisail-gradle-v1-linux-x64-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties', '**/pubspec.lock', '.flutter-version') }}
      - name: Restore Gradle wrapper
        id: gradle-wrapper
        if: matrix.target == 'android-arm64'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/wrapper
          key: bilisail-gradle-wrapper-v1-linux-x64-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Select Apple toolchain
        if: startsWith(matrix.target, 'macos-') || matrix.target == 'ios-arm64'
        shell: bash
        run: |
          # video_player_avfoundation uses AVFoundation's isolation-aware load API.
          # Both macOS runner architectures default to the incompatible Xcode 16.4.
          export DEVELOPER_DIR=/Applications/Xcode_26.2.app/Contents/Developer
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-version
          pod --version
      - uses: ./.github/actions/restore-flutter
        id: flutter
        with:
          architecture: ${{ matrix.arch }}
          cache-sdk: ${{ matrix.cache_sdk }}
      - name: Save shared Apple ARM64 SDK
        if: needs.prepare.outputs.cache-write == 'true' && matrix.cache_writer && matrix.cache_sdk && steps.flutter.outputs.sdk-hit != 'true'
        uses: ./.github/actions/save-ci-cache
        with:
          key: ${{ steps.flutter.outputs.sdk-key }}
          path: ${{ steps.flutter.outputs.sdk-path }}
          reserve-bytes: '2800000000'
      - name: Require native ARM64 Dart for Windows
        if: matrix.target == 'windows-arm64'
        timeout-minutes: 10
        shell: pwsh
        run: ./tool/setup-windows-arm64-flutter.ps1
      - name: Set up the Android mux compiler
        if: matrix.target == 'android-arm64'
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          # Disposable CI runners do not need cross-build VFS watching. Keep
          # local Gradle behavior and the dependency/wrapper caches unchanged.
          echo "GRADLE_OPTS=${GRADLE_OPTS:-} -Dorg.gradle.vfs.watch=false" >> "$GITHUB_ENV"
      - name: Resolve Linux dependency cache epoch
        id: linux-cache-epoch
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore Linux apt packages
        id: linux-apt
        if: matrix.target == 'linux-x64'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bilisail/linux/apt/*.deb
          key: linux-apt-v2-ubuntu24.04-x64-${{ hashFiles('tool/setup-linux-build.sh', 'tool/linux-apt-mirrors.py') }}-${{ steps.linux-cache-epoch.outputs.week }}
          restore-keys: |
            linux-apt-v2-ubuntu24.04-x64-${{ hashFiles('tool/setup-linux-build.sh', 'tool/linux-apt-mirrors.py') }}-
      - name: Restore verified Linux packaging tools
        id: linux-tools
        if: matrix.target == 'linux-x64'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bilisail/linux/tools
          key: linux-tools-v2-ubuntu24.04-x64-${{ hashFiles('tool/linux-downloads.sh') }}
      - name: Restore Linux Flatpak Runtime and SDK
        id: linux-flatpak
        if: matrix.target == 'linux-x64'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/flatpak
          key: linux-flatpak-v1-ubuntu24.04-x64-${{ hashFiles('linux/packaging/dev.bilisail.bilisail.json', 'tool/setup-linux-build.sh') }}-${{ steps.linux-cache-epoch.outputs.week }}
          restore-keys: |
            linux-flatpak-v1-ubuntu24.04-x64-${{ hashFiles('linux/packaging/dev.bilisail.bilisail.json', 'tool/setup-linux-build.sh') }}-
      - name: Set up Linux build and packaging dependencies
        if: matrix.target == 'linux-x64'
        shell: bash
        run: bash tool/setup-linux-build.sh
      # Save dependencies before building the app, so a packaging failure does
      # not discard downloads. The Flatpak snapshot contains no built app.
      - name: Save Linux apt packages
        if: needs.prepare.outputs.cache-write == 'true' && matrix.target == 'linux-x64' && steps.linux-apt.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-ci-cache
        with:
          path: ~/.cache/bilisail/linux/apt/*.deb
          key: ${{ steps.linux-apt.outputs.cache-primary-key }}
          reserve-bytes: '400000000'
      - name: Save verified Linux packaging tools
        if: needs.prepare.outputs.cache-write == 'true' && matrix.target == 'linux-x64' && steps.linux-tools.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-ci-cache
        with:
          path: ~/.cache/bilisail/linux/tools
          key: ${{ steps.linux-tools.outputs.cache-primary-key }}
          reserve-bytes: '150000000'
      - name: Save Linux Flatpak Runtime and SDK
        if: needs.prepare.outputs.cache-write == 'true' && matrix.target == 'linux-x64' && steps.linux-flatpak.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-ci-cache
        with:
          path: ~/.local/share/flatpak
          key: ${{ steps.linux-flatpak.outputs.cache-primary-key }}
          reserve-bytes: '1200000000'
      - uses: ./.github/actions/restore-mux
        id: mux-cache
        with:
          target: ${{ matrix.target }}
      # Resolve the locked identity and validate the DLL before paying for
      # MSYS2. Warm Windows builds need only the verified source tarball.
      - name: Set up the Windows mux compiler on cache miss
        id: windows-mux
        if: startsWith(matrix.target, 'windows-') && steps.mux-cache.outputs.valid != 'true'
        continue-on-error: true
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          cache: ${{ needs.prepare.outputs.cache-write == 'true' }}
          msystem: ${{ steps.mux-cache.outputs.msystem }}
          install: ${{ steps.mux-cache.outputs.install }}
      - name: Retry Windows mux compiler setup
        id: windows-mux-retry
        if: startsWith(matrix.target, 'windows-') && steps.windows-mux.outcome == 'failure'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          cache: ${{ needs.prepare.outputs.cache-write == 'true' }}
          msystem: ${{ steps.mux-cache.outputs.msystem }}
          install: ${{ steps.mux-cache.outputs.install }}
      - name: Build and package preview
        id: package
        timeout-minutes: ${{ startsWith(matrix.target, 'macos-') && 30 || 90 }}
        shell: pwsh
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          BILISAIL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BILISAIL_MUX_CACHE: 'true'
          BILI_MUX_MSYS_ROOT: ${{ steps.windows-mux-retry.outputs.msys2-location || steps.windows-mux.outputs.msys2-location }}
          ANDROID_PREVIEW_SIGNING: ${{ matrix.target == 'android-arm64' && github.event_name == 'pull_request' }}
          ANDROID_KEYSTORE_BASE64: ${{ matrix.target == 'android-arm64' && github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ matrix.target == 'android-arm64' && github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ matrix.target == 'android-arm64' && github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ matrix.target == 'android-arm64' && github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
          ANDROID_SIGNING_CERTIFICATE_SHA256: ${{ matrix.target == 'android-arm64' && vars.ANDROID_SIGNING_CERTIFICATE_SHA256 || '' }}
          MSIX_CERTIFICATE_BASE64: ${{ startsWith(matrix.target, 'windows-') && github.event_name != 'pull_request' && secrets.MSIX_CERTIFICATE_BASE64 || '' }}
          MSIX_CERTIFICATE_PASSWORD: ${{ startsWith(matrix.target, 'windows-') && github.event_name != 'pull_request' && secrets.MSIX_CERTIFICATE_PASSWORD || '' }}
        run: ./tool/build-release.ps1 -Target $env:BUILD_TARGET -Version $env:BUILD_VERSION -AndroidPreviewSigning:($env:ANDROID_PREVIEW_SIGNING -eq 'true')
      - name: Exercise Windows mux reuse without MSYS2
        if: startsWith(matrix.target, 'windows-')
        shell: pwsh
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BILISAIL_MUX_CACHE: 'true'
        run: |
          $component = "packages/bili_mux/native/prebuilt/$env:BUILD_TARGET"
          if (Test-Path -LiteralPath "$component/cache-manifest.json") {
            $before = (Get-Item -LiteralPath "$component/bili_mux.dll").LastWriteTimeUtc
            $absentCompiler = Join-Path $env:RUNNER_TEMP "absent-mux-$([guid]::NewGuid().ToString('N'))"
            ./tool/build-download-mux.ps1 -Target $env:BUILD_TARGET -MsysRoot $absentCompiler
            if ((Get-Item -LiteralPath "$component/bili_mux.dll").LastWriteTimeUtc -ne $before) {
              throw 'A verified Windows mux cache hit recompiled the DLL.'
            }
          }
      - name: Save verified native mux component
        if: >-
          !cancelled() && needs.prepare.outputs.cache-write == 'true' && matrix.mux_cache_writer &&
          steps.mux-cache.outputs.valid != 'true' && steps.package.outputs.mux-ready == 'true'
        uses: ./.github/actions/save-ci-cache
        with:
          key: ${{ steps.mux-cache.outputs.key }}
          path: ${{ steps.mux-cache.outputs.path }}
          reserve-bytes: '100000000'
      - name: Upload build stage timings
        if: always() && steps.package.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BiliSail-${{ matrix.target }}-${{ needs.prepare.outputs.version }}-build-timings
          path: artifacts/${{ matrix.target }}/diagnostics/build-timings.json
          if-no-files-found: ignore
          retention-days: 14
      # The build marks Pub ready only after strict resolution, before native
      # work. Preserve those downloads even if compilation or packaging fails.
      - name: Save platform Pub dependencies
        if: >-
          !cancelled() && needs.prepare.outputs.cache-write == 'true' &&
          matrix.cache_writer && steps.flutter.outputs.pub-hit != 'true' &&
          steps.package.outputs.pub-resolved == 'true'
        uses: ./.github/actions/save-ci-cache
        with:
          key: ${{ steps.flutter.outputs.pub-key }}
          path: ${{ steps.flutter.outputs.pub-path }}
      - name: Save Gradle dependencies
        if: needs.prepare.outputs.cache-write == 'true' && matrix.target == 'android-arm64' && steps.gradle.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-ci-cache
        with:
          path: ~/.gradle/caches
          key: ${{ steps.gradle.outputs.cache-primary-key }}
          reserve-bytes: '1700000000'
      - name: Save Gradle wrapper
        if: needs.prepare.outputs.cache-write == 'true' && matrix.target == 'android-arm64' && steps.gradle-wrapper.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-ci-cache
        with:
          path: ~/.gradle/wrapper
          key: ${{ steps.gradle-wrapper.outputs.cache-primary-key }}
          reserve-bytes: '600000000'
      - name: Collect Windows native build diagnostics
        if: failure() && startsWith(matrix.target, 'windows-')
        shell: pwsh
        env:
          MSIX_CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        run: ./tool/collect-build-diagnostics.ps1 -Destination artifacts/${{ matrix.target }}/diagnostics
      - name: Upload Windows build diagnostics
        if: failure() && startsWith(matrix.target, 'windows-')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BiliSail-${{ matrix.target }}-build-diagnostics
          path: artifacts/${{ matrix.target }}/diagnostics/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload packages and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BiliSail-${{ matrix.target }}-${{ needs.prepare.outputs.version }}-packages
          path: artifacts/${{ matrix.target }}/release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload macOS smoke results
        if: (failure() || cancelled()) && startsWith(matrix.target, 'macos-')
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BiliSail-${{ matrix.target }}-smoke-diagnostics
          path: |
            artifacts/${{ matrix.target }}/validation/*.result.json
            artifacts/${{ matrix.target }}/validation/*.crash.json
            artifacts/${{ matrix.target }}/validation/*.sample.json
          if-no-files-found: warn
          retention-days: 14

  native-mux:
    name: MP4 and MKV native regression
    needs: prepare
    if: needs.prepare.outputs.run-ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/restore-flutter
      - uses: ./.github/actions/restore-mux
        id: mux-cache
        with:
          target: linux-x64
      - name: Prepare the isolated native mux component
        id: mux
        shell: pwsh
        env:
          BILISAIL_MUX_CACHE: 'true'
        run: ./tool/build-download-mux.ps1 -Target linux-x64
      - name: Exercise verified mux reuse without recompiling
        shell: pwsh
        env:
          BILISAIL_MUX_CACHE: 'true'
        run: |
          $component = 'packages/bili_mux/native/prebuilt/linux-x64'
          if (Test-Path "$component/cache-manifest.json") {
            $before = (Get-Item "$component/libbili_mux.so").LastWriteTimeUtc
            ./tool/build-download-mux.ps1 -Target linux-x64
            if ((Get-Item "$component/libbili_mux.so").LastWriteTimeUtc -ne $before) { throw 'A verified mux cache hit recompiled the component.' }
          }
      - name: Build and verify the isolated MP4 component
        id: regression
        shell: bash
        run: |
          bash packages/bili_mux/tool/build-test-ffprobe.sh
          export BILI_MUX_LIBRARY="$PWD/packages/bili_mux/native/prebuilt/linux-x64/libbili_mux.so"
          export BILI_MUX_FFPROBE="$PWD/build/download_mux/test-ffprobe-linux-x64/ffprobe"
          cd packages/bili_mux
          flutter pub get --enforce-lockfile
          flutter test --no-pub
      - name: Save regression-verified Linux mux component
        if: >-
          !cancelled() && needs.prepare.outputs.cache-write == 'true' && steps.regression.outcome == 'success' &&
          steps.mux-cache.outputs.valid != 'true' && steps.mux.outputs.mux-ready == 'true'
        uses: ./.github/actions/save-ci-cache
        with:
          key: ${{ steps.mux-cache.outputs.key }}
          path: ${{ steps.mux-cache.outputs.path }}
          reserve-bytes: '100000000'
