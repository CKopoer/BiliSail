name: Windows validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Analyze and test all packages
        shell: pwsh
        run: ./tool/check.ps1
      - name: Build Windows
        run: flutter build windows --release
