name: Apple media playback
on:
  workflow_dispatch:
  push:
    branches: [codex/apple-edr-joc, codex/apple-joc-output]
    paths:
      - '.github/workflows/apple-playback.yml'
      - 'apple/**'
      - 'tool/validation/apple_*'
      - 'tool/native_tests/apple_joc_continuity.m'
      - 'packages/bili_player/lib/src/*dolby*'
      - 'packages/bili_player/lib/src/native_hdr_output.dart'
      - 'pubspec.lock'
      - 'test/fixtures/media/**'
      - 'tool/media-kit-patches/**'
permissions:
  contents: read
concurrency:
  group: apple-media-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exercise:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, ios-simulator]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the checked Dolby sample
        run: |
          mkdir -p build/fixtures
          cd build/fixtures
          curl --fail --retry 2 --silent --show-error -L --range 0-33554431 --max-time 180 'https://media.developer.dolby.com/DolbyVision_Atmos/mp4/iOS_P5_GlassBlowing2_1920x1080%4059.94fps_15200kbps.mp4' -o p5-joc.mp4
          echo '2e1a62c39519ccef267353672aff6c2985b7ef145739fb60b56029fa91ec6fac  p5-joc.mp4' | shasum -a 256 -c -
      - name: Boot an iPhone simulator
        id: boot
        if: matrix.platform == 'ios-simulator'
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(i["udid"] for runtime, group in reversed(list(json.load(sys.stdin)["devices"].items())) if "iOS" in runtime for i in group if "iPhone" in i["name"]))')
          echo "APPLE_SIMULATOR=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
      - if: matrix.platform == 'macos'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_26.2.app/Contents/Developer" >> "$GITHUB_ENV"
      - uses: ./.github/actions/restore-flutter
      - if: matrix.platform == 'macos'
        uses: ./.github/actions/restore-mux
        with:
          target: macos-arm64
      - name: Prepare application dependencies
        run: |
          if [[ -n "$APPLE_SIMULATOR" ]]; then
            bash packages/bili_mux/tool/build.sh ios-simulator-arm64
          else
            pwsh -NoProfile -File tool/build-download-mux.ps1 -Target macos-arm64
          fi
          flutter pub get --enforce-lockfile
      - name: Build and exercise the application surface
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp test/fixtures/media/{p84.mp4,hdr10.mp4,hlg.mp4,audio.m4a} build/fixtures/
          command -v ffmpeg >/dev/null || brew install ffmpeg
          cp test/fixtures/media/video.mp4 build/fixtures/
          (
            cd build/fixtures
            ffmpeg -v error -i p5-joc.mp4 -t 8 -map 0:a:0 -c copy -movflags +delay_moov+frag_keyframe -f mp4 joc.m4a
            ffmpeg -v error -i video.mp4 -i joc.m4a -map 0:v -map 1:a -t 8 -c copy joc.mkv
            ffmpeg -v error -i joc.mkv -c copy joc.mp4
            ffmpeg -v error -i audio.m4a -c:a eac3 -b:a 192k -f mp4 ddp.m4a
            ffprobe -v error -select_streams a:0 -show_entries stream=profile -of csv=p=0 joc.m4a | grep 'Dolby Atmos'
          )
          base=http://127.0.0.1:18085
          args=(--target tool/validation/apple_hdr_probe.dart
                --dart-define=APPLE_JOC_BASE=$base/ --dart-define=APPLE_P5=$base/p5-joc.mp4 --dart-define=APPLE_P8=$base/p84.mp4
                --dart-define=APPLE_HDR10=$base/hdr10.mp4 --dart-define=APPLE_HLG=$base/hlg.mp4
                --dart-define=APPLE_COMPANION_AUDIO=$base/audio.m4a)
          if [[ -n "$APPLE_SIMULATOR" ]]; then
            flutter build ios --simulator --debug "${args[@]}"
          else
            flutter build macos --release "${args[@]}"
          fi
          python3 tool/validation/apple_fixture_server.py build/fixtures >/tmp/bilisail-fixture-server.log 2>&1 &
          python3 - <<'PY'
          import os, pathlib, plistlib, subprocess
          simulator = os.environ.get("APPLE_SIMULATOR")
          if simulator:
              app = next(pathlib.Path("build/ios/iphonesimulator").glob("*.app"))
              bundle = plistlib.loads((app/"Info.plist").read_bytes())["CFBundleIdentifier"]
              subprocess.run(["xcrun", "simctl", "install", simulator, str(app)], check=True)
              command = ["xcrun", "simctl", "launch", "--console", simulator, bundle]
          else:
              app = next(pathlib.Path("build/macos/Build/Products/Release").glob("*.app"))
              command = [str(next((app/"Contents/MacOS").iterdir()))]
          try:
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=240)
          except subprocess.TimeoutExpired as exc:
              print((exc.stdout or b"").decode(errors="replace"))
              raise
          print(result.stdout)
          if result.returncode or "APPLE_MEDIA_PASSED" not in result.stdout:
              if not simulator and result.returncode < 0:
                  subprocess.run(["xcrun", "lldb", "--batch", "-o", "run", "-k", "thread backtrace all", "--", *command], timeout=120)
              raise SystemExit(f"Apple presentation probe exited with {result.returncode}")
          PY
      - name: Apple process diagnostics
        if: failure()
        run: |
          find ~/Library/Logs/DiagnosticReports -maxdepth 1 -iname '*BiliSail*' -print -exec tail -c 18000 {} \; 2>/dev/null || true
      - name: Compare JOC and PCM at the macOS audio output
        if: matrix.platform == 'macos'
        run: |
          brew install switchaudio-osx
          brew install --cask blackhole-2ch
          sudo killall coreaudiod || true
          for n in {1..30}; do SwitchAudioSource -a | grep -q 'BlackHole 2ch' && break; sleep 1; done
          SwitchAudioSource -s 'BlackHole 2ch' -t output
          frameworks="$PWD/build/macos/Build/Products/Release/BiliSail.app/Contents/Frameworks"
          clang -I build/apple-plugins/macos/media_kit_video/common/mpv/include \
            tool/native_tests/apple_joc_continuity.m -F "$frameworks" -framework Mpv \
            -framework AVFoundation -framework Foundation -framework CoreMedia \
            -Wl,-rpath,"$frameworks" -o build/joc-loopback
          python3 -m venv build/wave-tools
          build/wave-tools/bin/pip -q install numpy scipy sounddevice
          # Match the stereo route with a conventional Lo/Ro downmix of the 5.1 fixture.
          ffmpeg -v error -i build/fixtures/joc.m4a \
            -af 'pan=stereo|FL<FL+0.70710678*FC+0.70710678*SL|FR<FR+0.70710678*FC+0.70710678*SR' \
            -ar 48000 -c:a pcm_s16le build/reference.wav
          captures=build/joc-captures
          mkdir -p "$captures"
          for mode in joc pressure; do
            output="$captures/$mode.wav"
            build/wave-tools/bin/python tool/validation/apple_joc_waveform.py --record "$output" &
            recorder=$!
            for attempt in {1..100}; do test -f "$output.ready" && break; sleep 0.1; done
            test -f "$output.ready"
            sleep 1
            build/joc-loopback build/fixtures/joc.m4a "$mode"
            wait "$recorder"
          done
          for mode in joc pressure; do
            echo "$mode"
            build/wave-tools/bin/python tool/validation/apple_joc_waveform.py build/reference.wav "$captures/$mode.wav"
          done
      - name: Preserve failed audio comparison
        if: failure() && matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: joc-system-output
          path: |
            build/joc-captures/*.wav
            build/reference.wav
          if-no-files-found: ignore
