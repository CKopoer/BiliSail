name: FSPlayer Apple validation

on:
  push:
    branches: [codex/fsplayer-backend]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer

jobs:
  apple:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          cache: true
      - name: Prepare toolchain
        run: brew install autoconf automake libtool pkg-config nasm
      - name: Resolve pinned dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build iOS and macOS mux assets
        shell: pwsh
        run: |
          ./tool/build-download-mux.ps1 -Target ios-arm64
          ./tool/build-download-mux.ps1 -Target macos-arm64
      - name: Compile ordinary iOS entry
        run: flutter build ios --release --no-codesign
      - name: Compile ordinary macOS entry
        run: flutter build macos --release
      - name: Exercise native macOS DASH and lifecycle
        timeout-minutes: 10
        run: |
          fixtures="$HOME/Library/Containers/dev.bilisail.bilisail/Data/tmp/fsplayer-fixtures"
          mkdir -p "$fixtures"
          cp test/fixtures/media/video.mp4 test/fixtures/media/audio.m4a "$fixtures/"
          flutter build macos --release -t tool/validation/fsplayer_smoke.dart \
            --dart-define="FSPLAYER_FIXTURE_ROOT=$fixtures"
          python3 - <<'PY'
          import pathlib, subprocess, sys
          binary = pathlib.Path('build/macos/Build/Products/Release/BiliSail.app/Contents/MacOS/BiliSail')
          process = subprocess.Popen([str(binary.resolve())], stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          try:
              output, _ = process.communicate(timeout=120)
          except subprocess.TimeoutExpired:
              process.kill()
              output, _ = process.communicate(timeout=10)
          pathlib.Path('fsplayer-smoke.log').write_bytes(output)
          print(output.decode('utf-8', errors='replace'))
          sys.exit(0 if process.returncode == 0 and b'FSPLAYER_SMOKE_RESULT=0' in output else 1)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fsplayer-apple-validation
          path: |
            fsplayer-smoke.log
            build/ios/iphoneos/Runner.app/Frameworks/FSPlayer.framework/Info.plist
          retention-days: 7
