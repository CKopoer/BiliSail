name: FSPlayer Apple validation

on:
  push:
    branches: [codex/fsplayer-backend]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          cache: true
      - name: Prepare toolchain
        run: brew install autoconf automake libtool pkg-config nasm
      - name: Resolve pinned dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build iOS and macOS mux assets
        shell: pwsh
        run: |
          ./tool/build-download-mux.ps1 -Target ios-arm64
          ./tool/build-download-mux.ps1 -Target macos-arm64
      - name: Compile ordinary iOS entry
        run: flutter build ios --release --no-codesign
      - name: Compile ordinary macOS entry
        run: flutter build macos --release
      - name: Exercise native macOS DASH and lifecycle
        timeout-minutes: 10
        run: |
          flutter run -d macos --release -t tool/validation/fsplayer_smoke.dart \
            --dart-define="FSPLAYER_FIXTURE_ROOT=$PWD/test/fixtures/media" | tee fsplayer-smoke.log
          grep -q 'FSPLAYER_SMOKE_RESULT=0' fsplayer-smoke.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fsplayer-apple-validation
          path: |
            fsplayer-smoke.log
            build/ios/iphoneos/Runner.app/Frameworks/FSPlayer.framework/Info.plist
          retention-days: 7
