// Compile the pinned plugin with a source-scoped first-frame notification.
def patch = rootProject.file('../tool/media-kit-patches/android.patch')
project(':media_kit_video') {
    plugins.withId('com.android.library') {
        def java = android.sourceSets.getByName('main').java
        def upstream = java.srcDirs.toList()
        def output = layout.buildDirectory.dir('bilisail-video')
        def prepare = tasks.register('prepareBilisailVideoFrames', Sync) {
            inputs.file(patch)
            from(upstream) { into 'android/src/main/java' }
            into(output)
            doLast {
                def directory = destinationDir
                def process = new ProcessBuilder('git', 'apply', '--ignore-space-change',
                        '--whitespace=nowarn', patch.absolutePath).directory(directory)
                process.environment().put('GIT_CEILING_DIRECTORIES', directory.parentFile.absolutePath)
                if (process.inheritIO().start().waitFor() != 0)
                    throw new GradleException('Could not apply the Android video frame patch')
            }
        }
        java.setSrcDirs([prepare.map { new File(it.destinationDir, 'android/src/main/java') }])
        tasks.matching { it.name.startsWith('compile') || it.name.startsWith('lint') }.configureEach {
            dependsOn(prepare)
        }
    }
}
