name: bili_player
description: Generic playback contracts and native playback adapters for BiliSail.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'
dependencies:
  flutter:
    sdk: flutter
  ffi: 2.2.0
  media_kit:
    git:
      url: https://github.com/Predidit/media-kit.git
      path: media_kit
      ref: 484639aca5ffc754a65876c22f01dbb070225732
  media_kit_video:
    git:
      url: https://github.com/Predidit/media-kit.git
      path: media_kit_video
      ref: 484639aca5ffc754a65876c22f01dbb070225732

# Pub ignores overrides from transitive packages; repeat these in the app.
dependency_overrides:
  wakelock_plus: 1.8.1
  media_kit:
    git:
      url: https://github.com/Predidit/media-kit.git
      path: media_kit
      ref: 484639aca5ffc754a65876c22f01dbb070225732
  media_kit_video:
    git:
      url: https://github.com/Predidit/media-kit.git
      path: media_kit_video
      ref: 484639aca5ffc754a65876c22f01dbb070225732

dev_dependencies:
  material_ui: 1.11.0
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
