name: bili_player
description: Generic playback contracts and media_kit adapter for BiliSail.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  media_kit:
    git:
      url: https://github.com/Predidit/media-kit.git
      path: media_kit
      ref: 83b7ca63772856e1ea0158916177e136f7b7b0be
  media_kit_video:
    git:
      url: https://github.com/Predidit/media-kit.git
      path: media_kit_video
      ref: 83b7ca63772856e1ea0158916177e136f7b7b0be

# Overrides are repeated in the application root: Pub ignores dependency
# overrides from a transitive package. Keep every fork ref in sync.
dependency_overrides:
  # Match the application's existing wakelock_plus/package_info_plus pair.
  wakelock_plus: 1.8.1
  media_kit:
    git:
      url: https://github.com/Predidit/media-kit.git
      path: media_kit
      ref: 83b7ca63772856e1ea0158916177e136f7b7b0be
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
