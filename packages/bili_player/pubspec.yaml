name: bili_player
description: Generic playback contracts and native playback adapters for BiliSail.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  ffi: 2.2.0
  media_kit:
    git:
      url: https://github.com/CKopoer/media-kit.git
      path: media_kit
      ref: 302d60eedc55ca677e911e529569b1e14d8c2e7e
  media_kit_video:
    git:
      url: https://github.com/CKopoer/media-kit.git
      path: media_kit_video
      ref: 302d60eedc55ca677e911e529569b1e14d8c2e7e
