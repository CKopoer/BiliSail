name: bili_player
description: Generic playback contracts and media_kit adapter for BiliSail.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  ffi: 2.2.0
  media_kit:
    git:
      url: https://github.com/My-Responsitories/media-kit.git
      path: media_kit
      ref: 73771ec38176be2d984a3049c28177bce23b54a0
  media_kit_video:
    git:
      url: https://github.com/bggRGjQaUbCoE/media-kit.git
      path: media_kit_video
      ref: fd8421d21eade4d6d12de137fa7df902fec20292
  media_kit_libs_video:
    git:
      url: https://github.com/My-Responsitories/media-kit.git
      path: libs/universal/media_kit_libs_video
      ref: 73771ec38176be2d984a3049c28177bce23b54a0

# Pub ignores overrides from transitive packages; repeat these in the app.
dependency_overrides:
  wakelock_plus: 1.8.1
  media_kit:
    git:
      url: https://github.com/My-Responsitories/media-kit.git
      path: media_kit
      ref: 73771ec38176be2d984a3049c28177bce23b54a0
  media_kit_libs_video:
    git:
      url: https://github.com/My-Responsitories/media-kit.git
      path: libs/universal/media_kit_libs_video
      ref: 73771ec38176be2d984a3049c28177bce23b54a0
  media_kit_libs_android_video:
    git:
      url: https://github.com/My-Responsitories/media-kit.git
      path: libs/android/media_kit_libs_android_video
      ref: 73771ec38176be2d984a3049c28177bce23b54a0
  media_kit_libs_ios_video:
    git:
      url: https://github.com/My-Responsitories/media-kit.git
      path: libs/ios/media_kit_libs_ios_video
      ref: 73771ec38176be2d984a3049c28177bce23b54a0
  media_kit_libs_windows_video:
    git:
      url: https://github.com/My-Responsitories/media-kit.git
      path: libs/windows/media_kit_libs_windows_video
      ref: 73771ec38176be2d984a3049c28177bce23b54a0
  media_kit_native_event_loop:
    git:
      url: https://github.com/My-Responsitories/media-kit.git
      path: media_kit_native_event_loop
      ref: 73771ec38176be2d984a3049c28177bce23b54a0
  media_kit_video:
    git:
      url: https://github.com/bggRGjQaUbCoE/media-kit.git
      path: media_kit_video
      ref: fd8421d21eade4d6d12de137fa7df902fec20292
  media_kit_libs_macos_video: 1.1.4
  media_kit_libs_linux: 1.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
