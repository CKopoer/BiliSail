name: bili_player
description: Generic playback contracts and native playback adapters for BiliSail.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  ffi: 2.2.0
  code_assets: 2.1.0
  hooks: 2.2.0
  native_toolchain_c: 0.19.5
  meta: 1.19.0
