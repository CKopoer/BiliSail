name: bili_mux
description: Local MP4 stream-copy muxing, isolated from the playback backend.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.6'
dependencies:
  flutter:
    sdk: flutter
  ffi: 2.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  plugin:
    platforms:
      windows:
        ffiPlugin: true
      android:
        ffiPlugin: true
      macos:
        ffiPlugin: true
